  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0E1117;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      width: 3200px;
      height: 2200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── CONTEMPORARY ARCHITECTURAL DRAFTING SHEET ─── */
    .blueprint-sheet {
      position: relative;
      width: 3080px;
      height: 2080px;
      background-color: #FAF9F5;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.45),
        0 35px 85px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    /* Ultra-fine Subtle Paper Grain (Contemporary, Clean) */
    .paper-texture {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
    }

    /* SVG Canvas */
    svg.blueprint-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .font-mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .font-ui { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
