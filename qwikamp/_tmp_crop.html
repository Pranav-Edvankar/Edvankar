<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    #canvas { display: block; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const img = new Image();
  img.onload = () => {
    // The image is 16:9. Let's find the paper rectangle
    const tempC = document.createElement('canvas');
    tempC.width = img.width;
    tempC.height = img.height;
    const tempCtx = tempC.getContext('2d');
    tempCtx.drawImage(img, 0, 0);
    const data = tempCtx.getImageData(0, 0, img.width, img.height).data;

    let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
    for (let y = 0; y < img.height; y += 2) {
      for (let x = 0; x < img.width; x += 2) {
        const idx = (y * img.width + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        const brightness = (r + g + b) / 3;
        // Paper is warm yellowish cream
        if (brightness > 80 && r > 90) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    
    // Add small inset to avoid any dark edge pixels (e.g. 10px inside the paper)
    minX += 14;
    maxX -= 14;
    minY += 14;
    maxY -= 14;
    const cropW = maxX - minX;
    const cropH = maxY - minY;

    const c = document.getElementById('canvas');
    c.width = cropW;
    c.height = cropH;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

    console.log("PAPER_COORDS:" + JSON.stringify({ minX, maxX, minY, maxY, cropW, cropH, imgW: img.width, imgH: img.height }));
    const dataUrl = c.toDataURL('image/jpeg', 0.95);
    window.__DATA_URL__ = dataUrl;
  };
  img.src = "file:///e:/USER/Downloads/Edvankar/qwikamp/rustic_paper_bg.jpg";
</script>
</body>
</html>
